name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with Trusted Publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Install development dependencies
        run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          expected_tag="v${version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version (expected $expected_tag)."
            exit 1
          fi

      - name: Run source tests
        run: npm test

      - name: Build and test the browser bundle
        run: npm run test:dist

      - name: Build the minimal npm package
        run: npm run package

      - name: Publish with provenance
        run: npm publish ./dist/npm-package --provenance --access public
