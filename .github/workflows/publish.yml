name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with Trusted Publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Install development dependencies
        run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          expected_tag="v${version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version (expected $expected_tag)."
            exit 1
          fi

      - name: Run source tests
        run: npm test

      - name: Build and test the browser bundle
        run: npm run test:dist

      - name: Build the minimal npm package
        run: npm run package

      - name: Check whether this version is already on npm
        id: npm-version
        shell: bash
        run: |
          version="$(node -p 'require("./dist/npm-package/package.json").version')"
          package_spec="$(node -p 'require("./dist/npm-package/package.json").name')@$version"
          error_log="$RUNNER_TEMP/npm-view-error.log"
          # Published only when npm answers with this exact version. Some npm versions answer a missing version
          # of an existing package with success and no output instead of E404; that also means "not published".
          if registry_output="$(npm view "$package_spec" version --json 2>"$error_log")"; then
            if [ "$registry_output" = "\"$version\"" ]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$package_spec already exists on npm; skipping duplicate publication."
            elif [ -z "$registry_output" ]; then
              echo "already_published=false" >> "$GITHUB_OUTPUT"
            else
              echo "$registry_output"
              echo "::error::npm answered with an unexpected version for $package_spec."
              exit 1
            fi
          elif grep -q 'E404' "$error_log"; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_log"
            echo "::error::Could not determine whether $package_spec exists on npm."
            exit 1
          fi

      - name: Skip publication for an existing version
        if: steps.npm-version.outputs.already_published == 'true'
        run: echo "The exact package version is already present; all validation and packaging steps completed."

      - name: Publish with provenance
        if: steps.npm-version.outputs.already_published != 'true'
        run: npm publish ./dist/npm-package --provenance --access public
