<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWF Reader - Phase 1</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{max-width:1050px;margin:35px auto;padding:0 18px;background:#111827;color:#e5e7eb}
h1{margin-bottom:5px}p{color:#9ca3af}#drop{display:block;padding:30px;border:2px dashed #6b7280;border-radius:14px;text-align:center;cursor:pointer;margin:25px 0;background:#1f2937}#drop.over{border-color:#67e8f9}
#meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#1f2937;padding:12px;border-radius:8px}.metric strong{display:block;margin-top:5px;font-size:20px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #374151;text-align:left}th{position:sticky;top:0;background:#111827}.tablewrap{max-height:420px;overflow:auto}#status{white-space:pre-wrap}#preview{max-width:100%;border:1px solid #374151;background:#000}button{cursor:pointer}input[type=file]{display:none}
</style>
</head>
<body>
<h1>SWF Reader <small>v0.1</small></h1>
<p>Phase 1: inspect Flash files. No external libraries, rendering, or ActionScript execution.</p>
<label id="drop" for="file">Drop a .swf file here or click to open one</label>
<input id="file" type="file" accept=".swf,application/x-shockwave-flash">
<p id="status">Select a file to get started.</p>
<section id="meta"></section>
<h2>Stage (preview of dimensions and background color)</h2>
<canvas id="preview" width="550" height="320"></canvas>
<h2>SWF Tags</h2>
<div class="tablewrap"><table><thead><tr><th>#</th><th>Frame</th><th>Code</th><th>Type</th><th>Offset</th><th>Bytes</th></tr></thead><tbody id="tags"></tbody></table></div>
<script src="./swf-reader.js"></script>
<script>
(function(){
  'use strict';
  var input=document.getElementById('file'), drop=document.getElementById('drop'), status=document.getElementById('status');
  var meta=document.getElementById('meta'), tagBody=document.getElementById('tags'), canvas=document.getElementById('preview');
  function cell(row,value){var td=document.createElement('td');td.textContent=String(value);row.appendChild(td);}
  function metric(label,value){var el=document.createElement('div');el.className='metric';var title=document.createElement('span');title.textContent=label;var number=document.createElement('strong');number.textContent=String(value);el.appendChild(title);el.appendChild(number);meta.appendChild(el);}
  async function open(file){
    if(!file)return;
    status.textContent='Reading '+file.name+'…';meta.replaceChildren();tagBody.replaceChildren();
    try{
      var swf=await SWFReader.load(file);
      status.textContent=file.name+(swf.warnings.length?'\nWarnings: '+swf.warnings.join(' | '):' — structure read successfully');
      metric('Format',swf.signature+' (SWF '+swf.version+')');metric('Compression',swf.compression);
      metric('Stage',swf.width+' × '+swf.height+' px');metric('FPS',swf.fps);
      metric('Frames',swf.actualFrameCount+' / '+swf.frameCount);metric('Tags',swf.tags.length);
      metric('File size',swf.sourceLength+' bytes');metric('Scripts detected',swf.codeTags.avm1+' AVM1 · '+swf.codeTags.avm2+' AVM2');
      canvas.width=Math.max(1,Math.min(4096,Math.ceil(swf.width)));
      canvas.height=Math.max(1,Math.min(4096,Math.ceil(swf.height)));
      var ctx=canvas.getContext('2d');var bg=swf.background;
      ctx.fillStyle=bg?'rgb('+bg.r+','+bg.g+','+bg.b+')':'#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
      var fragment=document.createDocumentFragment();
      swf.tags.forEach(function(tag){var row=document.createElement('tr');
        [tag.index,tag.frame,tag.code,tag.name+(tag.label?' ('+tag.label+')':''),tag.offset,tag.length].forEach(function(v){cell(row,v);});fragment.appendChild(row);
      });tagBody.appendChild(fragment);
      window.currentSWF=swf; // acceso opcional desde DevTools
      console.log('SWF loaded:',swf);
    }catch(err){status.textContent='Error: '+err.message;console.error(err);}
  }
  input.addEventListener('change',function(){open(input.files[0]);});
  drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',function(){drop.classList.remove('over');});
  drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('over');open(e.dataTransfer.files[0]);});
})();
</script>
</body>
</html>
